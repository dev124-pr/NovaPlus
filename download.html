    <script>
    const supportToggleBtn = document.getElementById('support-toggle-btn');
    const supportMenu = document.getElementById('support-menu');
    const supportWidget = document.querySelector('.support-dropdown-widget');

    supportToggleBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        supportMenu.classList.toggle('hidden');
        supportWidget.classList.toggle('active');
    });

    // סגירת התפריט בלחיצה מחוץ לכפתור
    window.addEventListener('click', () => {
        if (!supportMenu.classList.contains('hidden')) {
            supportMenu.classList.add('hidden');
            supportWidget.classList.remove('active');
        }
    });

    supportMenu.addEventListener('click', (e) => {
        e.stopPropagation();
    });
</script>


    <script>
    const accessibilityBtn = document.getElementById('accessibility-btn');
    const accessibilityMenu = document.getElementById('accessibility-menu');

    accessibilityBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        accessibilityMenu.classList.toggle('hidden');
    });

    // סגירת התפריט בלחיצה מחוץ לו
    window.addEventListener('click', () => {
        if (!accessibilityMenu.classList.contains('hidden')) {
            accessibilityMenu.classList.add('hidden');
        }
    });

    accessibilityMenu.addEventListener('click', (e) => {
        e.stopPropagation();
    });

    // פונקציות נגישות גלובליות
    window.toggleFontSize = function() {
        document.body.classList.toggle('large-font');
    };

    window.toggleContrast = function() {
        document.body.classList.toggle('high-contrast');
    };

    window.resetAccessibility = function() {
        document.body.classList.remove('large-font');
        document.body.classList.remove('high-contrast');
    };
</script>

<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<script type="text/javascript">
   (function(){
      emailjs.init("s01gk5Y3F4Zg9WVb0"); // החלף ב-Public Key שלך מ-EmailJS
   })();
</script>

<script>
    const commentForm = document.getElementById('comment-form');
    const commentsList = document.getElementById('comments-list');

    // טעינת תגובות קיימות מהזיכרון של הדפדפן (localStorage) כדי שכולם יראו אותן בזמן אמת
    document.addEventListener('DOMContentLoaded', loadComments);

    commentForm.addEventListener('submit', function(e) {
        e.preventDefault();

        const name = document.getElementById('comment-name').value;
        const text = document.getElementById('comment-text').value;

        const newComment = { name, text, date: new Date().toLocaleString() };

        // שמירה מקומית להצגה מיידית באתר
        saveCommentToLocalStorage(newComment);
        appendCommentToDOM(newComment);

        // שליחת התראה למייל שלך דרך EmailJS
        emailjs.send("service_qvzvzmd", "template_8ea8duk", {
            from_name: name,
            message: text,
            to_email: "autoclinner@gmail.com"
        }).then(function(response) {
            console.log('Email sent successfully!', response.status, response.text);
        }, function(error) {
            console.log('Failed to send email.', error);
        });

        // איפוס הטופס
        commentForm.reset();
    });

    function saveCommentToLocalStorage(comment) {
        let comments = JSON.parse(localStorage.getItem('nova_comments')) || [];
        comments.unshift(comment); // הוספה לראש הרשימה
        localStorage.setItem('nova_comments', JSON.stringify(comments));
    }

    function loadComments() {
        let comments = JSON.parse(localStorage.getItem('nova_comments')) || [];
        comments.forEach(comment => appendCommentToDOM(comment));
    }

    function appendCommentToDOM(comment) {
        const div = document.createElement('div');
        div.classList.add('comment-item');
        div.innerHTML = `
            <div class="comment-author">${escapeHtml(comment.name)} <span style="font-size:0.75rem; color:#888; font-weight:normal;">(${comment.date})</span></div>
            <div class="comment-body">${escapeHtml(comment.text)}</div>
        `;
        commentsList.prepend(div);
    }

    // הגנה בסיסית מפני קוד זדוני
    function deselectHtml(text) {
        return text;
    }
    function escapeHtml(text) {
        const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
        return text.replace(/[&<>"']/g, function(m) { return map[m]; });
    }
</script>
