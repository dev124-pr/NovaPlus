    <!-- רכיב נגישות ותמיכה צף -->
    <div class="bottom-left-widgets">
        
        <!-- כפתור ה-Support המתקפל -->
        <div class="support-dropdown-widget">
            <div id="support-menu" class="support-menu hidden">
                <a href="https://discord.gg/Fdg2aeKgpY" target="_blank" class="support-sub-btn" title="Discord"><i class="fa-brands fa-discord"></i></a>
                <a href="https://www.tiktok.com/@autoclinner?_r=1&_t=ZS-98TOoX8X1sN" target="_blank" class="support-sub-btn" title="TikTok"><i class="fa-brands fa-tiktok"></i></a>
                <a href="https://www.reddit.com/u/NovaPlus2807/s/zfKSzyH4At" target="_blank" class="support-sub-btn" title="Reddit"><i class="fa-brands fa-reddit-alien"></i></a>

            </div>
            
            <button id="support-toggle-btn" class="support-main-btn">
                <span class="support-text-vertical">
                    <span>S</span><span>U</span><span>P</span><span>P</span><span>O</span><span>R</span><span>T</span>
                </span>
                <span class="support-icon-s">S</span>
            </button>
        </div>

        <!-- רכיב נגישות -->
        <div class="accessibility-widget">
            <button id="accessibility-btn" aria-label="Accessibility Menu">
                <img src="accebility.png" alt="Accessibility" class="custom-accessibility-icon">
            </button>
            <div id="accessibility-menu" class="accessibility-menu hidden">
                <h3>Accessibility Tools</h3>
                <button onclick="toggleFontSize()">🔠 Toggle Large Font</h2></button>
                <button onclick="toggleContrast()">🌓 High Contrast</button>
                <button onclick="resetAccessibility()">🔄 Reset</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        // Support Dropdown Logic
        const supportToggleBtn = document.getElementById('support-toggle-btn');
        const supportMenu = document.getElementById('support-menu');
        const supportWidget = document.querySelector('.support-dropdown-widget');

        supportToggleBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            supportMenu.classList.toggle('hidden');
            supportWidget.classList.toggle('active');
        });

        window.addEventListener('click', () => {
            if (!supportMenu.classList.contains('hidden')) {
                supportMenu.classList.add('hidden');
                supportWidget.classList.remove('active');
            }
        });

        // Accessibility Logic
        const accessibilityBtn = document.getElementById('accessibility-btn');
        const accessibilityMenu = document.getElementById('accessibility-menu');

        accessibilityBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            accessibilityMenu.classList.toggle('hidden');
        });

        window.toggleFontSize = () => document.body.classList.toggle('large-font');
        window.toggleContrast = () => document.body.classList.toggle('high-contrast');
        window.resetAccessibility = () => {
            document.body.classList.remove('large-font');
            document.body.classList.remove('high-contrast');
        };
    </script>
